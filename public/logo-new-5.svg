<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="grad5a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="grad5b" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  
  <!-- 圆角矩形背景 -->
  <rect x="15" y="15" width="170" height="170" rx="30" fill="url(#grad5a)"/>
  
  <!-- 渐变边框 -->
  <rect x="15" y="15" width="170" height="170" rx="30" fill="none" stroke="url(#grad5b)" stroke-width="3"/>
  
  <!-- 左侧装饰线 -->
  <rect x="30" y="55" width="4" height="90" rx="2" fill="url(#grad5b)"/>
  
  <!-- D 字母 -->
  <text x="105" y="130" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" 
        font-size="90" font-weight="700" fill="#ffffff" text-anchor="middle">D</text>
  
  <!-- 底部标签 -->
  <rect x="55" y="150" width="100" height="24" rx="12" fill="url(#grad5b)" fill-opacity="0.2"/>
  <text x="105" y="167" font-family="'SF Pro Text', Arial, sans-serif" 
        font-size="11" fill="#06b6d4" text-anchor="middle" letter-spacing="2">FRONTEND</text>
</svg>
