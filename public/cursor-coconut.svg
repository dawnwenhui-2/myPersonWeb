    <circle cx="6.5" cy="9.5" r="0.8" fill="#FFFFFF"/>
    <circle cx="14.5" cy="9.5" r="0.8" fill="#FFFFFF"/>
    <!-- 微笑 -->
    <path d="M6,15 Q10,18 14,15" fill="none" stroke="#1A1A1A" stroke-width="1.5" stroke-linecap="round"/>
    <!-- 腮红 -->
    <ellipse cx="4" cy="13" rx="2" ry="1.5" fill="#FFAB91" fill-opacity="0.6"/>
    <ellipse cx="16" cy="13" rx="2" ry="1.5" fill="#FFAB91" fill-opacity="0.6"/>
  </g>
