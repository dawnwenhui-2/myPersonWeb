<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="rb3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7">
        <animate attributeName="stop-color" values="#fef3c7;#d9f99d;#fef3c7" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#fef9c3"/>
    </linearGradient>
    <linearGradient id="rb3b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
  </defs>
  
  <!-- 圆润身体 -->
  <ellipse cx="100" cy="115" rx="75" ry="70" fill="url(#rb3)"/>
  
  <!-- 左兔耳 -->
  <ellipse cx="60" cy="30" rx="20" ry="48" fill="url(#rb3)"/>
  <ellipse cx="60" cy="30" rx="11" ry="32" fill="#fed7aa"/>
  
  <!-- 右兔耳 -->
  <ellipse cx="140" cy="30" rx="20" ry="48" fill="url(#rb3)"/>
  <ellipse cx="140" cy="30" rx="11" ry="32" fill="#fed7aa"/>
  
  <!-- 大眼睛 -->
  <ellipse cx="70" cy="100" rx="18" ry="20" fill="#1e1b4b">
    <animate attributeName="ry" values="20;2;20" dur="3.5s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="130" cy="100" rx="18" ry="20" fill="#1e1b4b">
    <animate attributeName="ry" values="20;2;20" dur="3.5s" repeatCount="indefinite" begin="0.1s"/>
  </ellipse>
  
  <!-- 闪亮高光 -->
  <circle cx="75" cy="94" r="6" fill="#ffffff">
    <animate attributeName="opacity" values="1;0;1" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="135" cy="94" r="6" fill="#ffffff">
    <animate attributeName="opacity" values="1;0;1" dur="3.5s" repeatCount="indefinite" begin="0.1s"/>
  </circle>
  <circle cx="68" cy="102" r="3" fill="#ffffff" fill-opacity="0.6">
    <animate attributeName="opacity" values="0.6;0;0.6" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="128" cy="102" r="3" fill="#ffffff" fill-opacity="0.6">
    <animate attributeName="opacity" values="0.6;0;0.6" dur="3.5s" repeatCount="indefinite" begin="0.1s"/>
  </circle>
  
  <!-- 腮红 -->
  <ellipse cx="48" cy="118" rx="16" ry="11" fill="#fda4af" fill-opacity="0.5">
    <animate attributeName="fill-opacity" values="0.5;0.8;0.5" dur="1.8s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="152" cy="118" rx="16" ry="11" fill="#fda4af" fill-opacity="0.5">
    <animate attributeName="fill-opacity" values="0.5;0.8;0.5" dur="1.8s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- 三角鼻子 -->
  <polygon points="100,115 94,125 106,125" fill="url(#rb3b)"/>
  
  <!-- 微笑嘴 -->
  <path d="M88,130 Q100,142 112,130" fill="none" stroke="url(#rb3b)" stroke-width="3" stroke-linecap="round">
    <animate attributeName="d" values="M88,130 Q100,142 112,130;M88,130 Q100,148 112,130;M88,130 Q100,142 112,130" dur="2.5s" repeatCount="indefinite"/>
  </path>
  
  <!-- 小牙 -->
  <rect x="96" y="138" width="8" height="6" rx="2" fill="#ffffff"/>
  
  <!-- 名字 -->
  <text x="100" y="195" font-family="'Nunito', sans-serif" font-size="16" font-weight="700" fill="#f97316" text-anchor="middle">dawnwenhui</text>
</svg>
