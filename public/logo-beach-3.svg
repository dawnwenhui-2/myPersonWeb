<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- 简洁圆形背景 -->
  <circle cx="100" cy="100" r="95" fill="#87CEEB"/>
  
  <!-- 海洋 -->
  <ellipse cx="100" cy="150" rx="95" ry="30" fill="#4FC3F7"/>
  
  <!-- 沙滩 -->
  <ellipse cx="100" cy="175" rx="95" ry="25" fill="#FFE082"/>
  
  <!-- 太阳 -->
  <circle cx="150" cy="50" r="25" fill="#FFEE58"/>
  
  <!-- 简洁 D -->
  <text x="100" y="115" font-family="'Arial Black', sans-serif" font-size="70" font-weight="900" fill="#FFFFFF" text-anchor="middle" stroke="#29B6F6" stroke-width="3">D</text>
  
  <!-- 名字 -->
  <text x="100" y="190" font-family="'Arial', sans-serif" font-size="14" font-weight="bold" fill="#5D4037" text-anchor="middle">dawnwenhui</text>
</svg>
