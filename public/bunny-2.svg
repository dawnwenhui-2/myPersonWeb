<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="rb2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#c7d2fe"/>
    </linearGradient>
    <linearGradient id="rb2b" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  
  <!-- 头 -->
  <circle cx="100" cy="105" r="65" fill="url(#rb2)"/>
  
  <!-- 左长耳 -->
  <ellipse cx="55" cy="30" rx="14" ry="50" fill="url(#rb2)">
    <animate attributeName="cy" values="30;35;30" dur="1s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="55" cy="30" rx="7" ry="35" fill="#ddd6fe">
    <animate attributeName="cy" values="30;35;30" dur="1s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- 右长耳 -->
  <ellipse cx="145" cy="30" rx="14" ry="50" fill="url(#rb2)">
    <animate attributeName="cy" values="30;35;30" dur="1s" repeatCount="indefinite" begin="0.3s"/>
  </ellipse>
  <ellipse cx="145" cy="30" rx="7" ry="35" fill="#ddd6fe">
    <animate attributeName="cy" values="30;35;30" dur="1s" repeatCount="indefinite" begin="0.3s"/>
  </ellipse>
  
  <!-- 眼睛 -->
  <circle cx="72" cy="95" r="14" fill="#1e1b4b">
    <animate attributeName="r" values="14;1;14" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="128" cy="95" r="14" fill="#1e1b4b">
    <animate attributeName="r" values="14;1;14" dur="4s" repeatCount="indefinite" begin="0.05s"/>
  </circle>
  
  <!-- 眼睛高光 -->
  <circle cx="76" cy="90" r="5" fill="#ffffff">
    <animate attributeName="opacity" values="1;0;1" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="132" cy="90" r="5" fill="#ffffff">
    <animate attributeName="opacity" values="1;0;1" dur="4s" repeatCount="indefinite" begin="0.05s"/>
  </circle>
  
  <!-- 腮红 -->
  <ellipse cx="50" cy="110" rx="15" ry="10" fill="#fda4af" fill-opacity="0.5">
    <animate attributeName="fill-opacity" values="0.5;0.8;0.5" dur="2s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="150" cy="110" rx="15" ry="10" fill="#fda4af" fill-opacity="0.5">
    <animate attributeName="fill-opacity" values="0.5;0.8;0.5" dur="2s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- 鼻子 -->
  <ellipse cx="100" cy="112" rx="7" ry="6" fill="url(#rb2b)"/>
  
  <!-- 微笑 -->
  <path d="M88,125 Q100,135 112,125" fill="none" stroke="#6366f1" stroke-width="3" stroke-linecap="round">
    <animate attributeName="d" values="M88,125 Q100,135 112,125;M88,125 Q100,140 112,125;M88,125 Q100,135 112,125" dur="2s" repeatCount="indefinite"/>
  </path>
  
  <!-- 胡须 -->
  <line x1="55" y1="115" x2="30" y2="110" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.3"/>
  <line x1="55" y1="120" x2="30" y2="125" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.3"/>
  <line x1="145" y1="115" x2="170" y2="110" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.3"/>
  <line x1="145" y1="120" x2="170" y2="125" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.3"/>
  
  <!-- 名字 -->
  <text x="100" y="190" font-family="'Nunito', sans-serif" font-size="16" font-weight="700" fill="#6366f1" text-anchor="middle">dawnwenhui</text>
</svg>
