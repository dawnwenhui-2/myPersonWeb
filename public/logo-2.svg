<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- 背景六边形 -->
  <polygon points="100,20 170,60 170,140 100,180 30,140 30,60" 
           fill="none" stroke="url(#grad2)" stroke-width="2" filter="url(#glow)"/>
  
  <!-- D 字母 -->
  <text x="65" y="130" font-family="Arial, sans-serif" font-size="90" font-weight="bold" fill="url(#grad2)">D</text>
  
  <!-- 装饰线条 -->
  <line x1="140" y1="50" x2="160" y2="35" stroke="#8b5cf6" stroke-width="2"/>
  <line x1="160" y1="35" x2="175" y2="35" stroke="#8b5cf6" stroke-width="2"/>
  
  <!-- 原子轨道装饰 -->
  <ellipse cx="100" cy="100" rx="85" ry="30" fill="none" stroke="#6366f1" stroke-width="1" opacity="0.3" transform="rotate(-30, 100, 100)"/>
</svg>
