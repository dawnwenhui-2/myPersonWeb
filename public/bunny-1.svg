<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="rb1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fce7f3"/>
      <stop offset="100%" stop-color="#fdf2f8"/>
    </linearGradient>
    <linearGradient id="rb1b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
  
  <!-- 身体 -->
  <ellipse cx="100" cy="115" rx="70" ry="65" fill="url(#rb1)"/>
  
  <!-- 左兔耳 -->
  <ellipse cx="60" cy="35" rx="18" ry="45" fill="url(#rb1)">
    <animateTransform attributeName="transform" type="rotate" values="-10 60 70;-15 60 70;-10 60 70" dur="0.4s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="60" cy="35" rx="10" ry="30" fill="#fda4af">
    <animateTransform attributeName="transform" type="rotate" values="-10 60 70;-15 60 70;-10 60 70" dur="0.4s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- 右兔耳 -->
  <ellipse cx="140" cy="35" rx="18" ry="45" fill="url(#rb1)">
    <animateTransform attributeName="transform" type="rotate" values="10 140 70;15 140 70;10 140 70" dur="0.4s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="140" cy="35" rx="10" ry="30" fill="#fda4af">
    <animateTransform attributeName="transform" type="rotate" values="10 140 70;15 140 70;10 140 70" dur="0.4s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- 脸部 -->
  <ellipse cx="100" cy="110" rx="55" ry="50" fill="#ffffff"/>
  
  <!-- 左眼 -->
  <ellipse cx="75" cy="100" rx="12" ry="14" fill="#1e1b4b">
    <animate attributeName="ry" values="14;1;14" dur="3s" repeatCount="indefinite"/>
  </ellipse>
  <circle cx="78" cy="96" r="4" fill="#ffffff">
    <animate attributeName="opacity" values="1;0;1" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <!-- 右眼 -->
  <ellipse cx="125" cy="100" rx="12" ry="14" fill="#1e1b4b">
    <animate attributeName="ry" values="14;1;14" dur="3s" repeatCount="indefinite" begin="0.1s"/>
  </ellipse>
  <circle cx="128" cy="96" r="4" fill="#ffffff">
    <animate attributeName="opacity" values="1;0;1" dur="3s" repeatCount="indefinite" begin="0.1s"/>
  </circle>
  
  <!-- 腮红 -->
  <ellipse cx="55" cy="115" rx="14" ry="10" fill="#fda4af" fill-opacity="0.6">
    <animate attributeName="fill-opacity" values="0.6;0.9;0.6" dur="1.5s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="145" cy="115" rx="14" ry="10" fill="#fda4af" fill-opacity="0.6">
    <animate attributeName="fill-opacity" values="0.6;0.9;0.6" dur="1.5s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- 鼻子 -->
  <ellipse cx="100" cy="118" rx="6" ry="5" fill="url(#rb1b)"/>
  
  <!-- 嘴巴 -->
  <path d="M92,126 Q100,134 108,126" fill="none" stroke="url(#rb1b)" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- 蝴蝶结 -->
  <ellipse cx="100" cy="55" rx="12" ry="8" fill="#f472b6">
    <animate attributeName="ry" values="8;10;8" dur="1s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="85" cy="55" rx="8" ry="6" fill="#f472b6"/>
  <ellipse cx="115" cy="55" rx="8" ry="6" fill="#f472b6"/>
  <circle cx="100" cy="55" r="5" fill="#fbbf24"/>
  
  <!-- 名字 -->
  <text x="100" y="190" font-family="'Nunito', sans-serif" font-size="16" font-weight="700" fill="#ec4899" text-anchor="middle">dawnwenhui</text>
</svg>
