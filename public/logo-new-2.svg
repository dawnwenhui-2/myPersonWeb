<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="grad2a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="grad2b" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="shadow2">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#6366f1" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- 背景卡片 -->
  <rect x="10" y="10" width="180" height="180" rx="24" fill="url(#grad2a)" filter="url(#shadow2)"/>
  
  <!-- 内部装饰圆 -->
  <circle cx="160" cy="40" r="60" fill="url(#grad2b)" fill-opacity="0.3"/>
  <circle cx="40" cy="160" r="40" fill="#06b6d4" fill-opacity="0.2"/>
  
  <!-- D 字母 -->
  <text x="100" y="130" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" 
        font-size="100" font-weight="700" fill="#ffffff" text-anchor="middle">D</text>
  
  <!-- 代码符号 -->
  <text x="40" y="60" font-family="'SF Mono', 'Menlo', monospace" font-size="16" fill="#ffffff" fill-opacity="0.7">&lt;</text>
  <text x="150" y="60" font-family="'SF Mono', 'Menlo', monospace" font-size="16" fill="#ffffff" fill-opacity="0.7">/&gt;</text>
</svg>
