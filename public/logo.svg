<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 背景圆形 -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="url(#grad1)" stroke-width="3"/>
  
  <!-- 代码括号 < > -->
  <text x="55" y="130" font-family="Fira Code, monospace" font-size="80" font-weight="bold" fill="url(#grad1)">&lt;</text>
  <text x="105" y="130" font-family="Fira Code, monospace" font-size="80" font-weight="bold" fill="url(#grad1)">/&gt;</text>
  
  <!-- 装饰点 -->
  <circle cx="100" cy="40" r="4" fill="#6366f1"/>
  <circle cx="160" cy="100" r="3" fill="#8b5cf6"/>
  <circle cx="40" cy="100" r="3" fill="#06b6d4"/>
</svg>
