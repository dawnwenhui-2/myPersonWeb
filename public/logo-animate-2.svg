<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="ag2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
  </defs>
  
  <!-- 身体 -->
  <ellipse cx="100" cy="105" rx="85" ry="80" fill="url(#ag2)">
    <animate attributeName="ry" values="80;82;80" dur="2s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- 左耳 -->
  <g>
    <path d="M30,60 L50,25 L70,55 Z" fill="#fef3c7" stroke="#f97316" stroke-width="2" stroke-linejoin="round">
      <animate attributeName="d" values="M30,60 L50,25 L70,55 Z;M32,58 L50,23 L68,53 Z;M30,60 L50,25 L70,55 Z" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M40,55 L50,35 L60,52 Z" fill="#fda4af"/>
  </g>
  
  <!-- 右耳 -->
  <g>
    <path d="M170,60 L150,25 L130,55 Z" fill="#fef3c7" stroke="#f97316" stroke-width="2" stroke-linejoin="round">
      <animate attributeName="d" values="M170,60 L150,25 L130,55 Z;M168,58 L150,23 L132,53 Z;M170,60 L150,25 L130,55 Z" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M160,55 L150,35 L140,52 Z" fill="#fda4af"/>
  </g>
  
  <!-- 左眼眨眼 -->
  <ellipse cx="70" cy="95" rx="18" ry="22" fill="#1e1b4b">
    <animate attributeName="ry" values="22;2;22" dur="4s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- 右眼眨眼 -->
  <ellipse cx="130" cy="95" rx="18" ry="22" fill="#1e1b4b">
    <animate attributeName="ry" values="22;2;22" dur="4s" repeatCount="indefinite" begin="0.1s"/>
  </ellipse>
  
  <!-- 左眼高光 -->
  <circle cx="75" cy="88" r="6" fill="#ffffff">
    <animate attributeName="opacity" values="1;0;1" dur="4s" repeatCount="indefinite"/>
  </circle>
  
  <!-- 右眼高光 -->
  <circle cx="135" cy="88" r="6" fill="#ffffff">
    <animate attributeName="opacity" values="1;0;1" dur="4s" repeatCount="indefinite" begin="0.1s"/>
  </circle>
  
  <!-- 腮红 -->
  <ellipse cx="55" cy="115" rx="12" ry="8" fill="#fda4af" fill-opacity="0.6">
    <animate attributeName="fill-opacity" values="0.6;0.8;0.6" dur="2s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="145" cy="115" rx="12" ry="8" fill="#fda4af" fill-opacity="0.6">
    <animate attributeName="fill-opacity" values="0.6;0.8;0.6" dur="2s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- 鼻子 -->
  <ellipse cx="100" cy="115" rx="6" ry="5" fill="#f97316"/>
  
  <!-- 嘴巴微笑 -->
  <path d="M85,125 Q100,140 115,125" fill="none" stroke="#f97316" stroke-width="3" stroke-linecap="round">
    <animate attributeName="d" values="M85,125 Q100,140 115,125;M85,125 Q100,145 115,125;M85,125 Q100,140 115,125" dur="3s" repeatCount="indefinite"/>
  </path>
  
  <!-- 名字 -->
  <text x="100" y="178" font-family="'Nunito', 'Comic Sans MS', cursive" 
        font-size="28" font-weight="800" fill="#f97316" text-anchor="middle">dawnwenhui</text>
</svg>
