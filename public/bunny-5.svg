<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="rb5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf4ff">
        <animate attributeName="stop-color" values="#fdf4ff;#fae8ff;#fdf4ff" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#fae8ff"/>
    </linearGradient>
    <linearGradient id="rb5b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7">
        <animate attributeName="stop-color" values="#a855f7;#ec4899;#a855f7" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  
  <!-- 背景圆 -->
  <circle cx="100" cy="100" r="90" fill="url(#rb5)"/>
  
  <!-- 头 -->
  <circle cx="100" cy="110" r="60" fill="#ffffff"/>
  
  <!-- 左竖耳 -->
  <ellipse cx="60" cy="40" rx="16" ry="45" fill="#ffffff">
    <animateTransform attributeName="transform" type="rotate" values="-5 60 65;-10 60 65;-5 60 65" dur="0.6s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="60" cy="40" rx="8" ry="30" fill="#fda4af">
    <animateTransform attributeName="transform" type="rotate" values="-5 60 65;-10 60 65;-5 60 65" dur="0.6s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- 右竖耳 -->
  <ellipse cx="140" cy="40" rx="16" ry="45" fill="#ffffff">
    <animateTransform attributeName="transform" type="rotate" values="5 140 65;10 140 65;5 140 65" dur="0.6s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="140" cy="40" rx="8" ry="30" fill="#fda4af">
    <animateTransform attributeName="transform" type="rotate" values="5 140 65;10 140 65;5 140 65" dur="0.6s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- 闪亮眼睛 -->
  <ellipse cx="72" cy="105" rx="14" ry="16" fill="#1e1b4b">
    <animate attributeName="ry" values="16;2;16" dur="3s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="128" cy="105" rx="14" ry="16" fill="#1e1b4b">
    <animate attributeName="ry" values="16;2;16" dur="3s" repeatCount="indefinite" begin="0.12s"/>
  </ellipse>
  
  <!-- 大高光 -->
  <circle cx="77" cy="100" r="5" fill="#ffffff">
    <animate attributeName="opacity" values="1;0;1" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="133" cy="100" r="5" fill="#ffffff">
    <animate attributeName="opacity" values="1;0;1" dur="3s" repeatCount="indefinite" begin="0.12s"/>
  </circle>
  
  <!-- 腮红 -->
  <ellipse cx="50" cy="118" rx="15" ry="10" fill="#fda4af" fill-opacity="0.5">
    <animate attributeName="fill-opacity" values="0.5;0.9;0.5" dur="1.5s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="150" cy="118" rx="15" ry="10" fill="#fda4af" fill-opacity="0.5">
    <animate attributeName="fill-opacity" values="0.5;0.9;0.5" dur="1.5s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- 星星鼻子 -->
  <polygon points="100,115 96,122 103,126 97,130 100,138 103,130 97,126 103,122" fill="url(#rb5b)">
    <animateTransform attributeName="transform" type="rotate" values="0 100 127;360 100 127" dur="8s" repeatCount="indefinite"/>
  </polygon>
  
  <!-- 微笑 -->
  <path d="M86,135 Q100,148 114,135" fill="none" stroke="url(#rb5b)" stroke-width="2.5" stroke-linecap="round">
    <animate attributeName="d" values="M86,135 Q100,148 114,135;M86,135 Q100,152 114,135;M86,135 Q100,148 114,135" dur="2s" repeatCount="indefinite"/>
  </path>
  
  <!-- 名字 -->
  <text x="100" y="188" font-family="'Nunito', sans-serif" font-size="15" font-weight="700" fill="#a855f7" text-anchor="middle">
    dawnwenhui
    <animate attributeName="fill" values="#a855f7;#ec4899;#7c3aed;#a855f7" dur="4s" repeatCount="indefinite"/>
  </text>
</svg>
