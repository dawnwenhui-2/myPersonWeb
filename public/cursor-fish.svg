<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- 鱼儿光标 -->
  <polygon points="0,0 0,24 6,18 10,28 13,27 9,17 16,17" fill="#4FC3F7" stroke="#29B6F6" stroke-width="1"/>
  <!-- 小鱼 -->
  <g transform="translate(5, 4)">
    <!-- 身体 -->
    <ellipse cx="11" cy="12" rx="8" ry="5" fill="#FF7043"/>
    <!-- 尾巴 -->
    <polygon points="2,12 6,8 6,16" fill="#FF5722"/>
    <!-- 眼睛 -->
    <circle cx="16" cy="10" r="2" fill="#FFFFFF"/>
    <circle cx="16.5" cy="10" r="1" fill="#1e1b4b"/>
    <!-- 鱼鳍 -->
    <ellipse cx="11" cy="7" rx="3" ry="2" fill="#FF8A65"/>
    <!-- 泡泡 -->
    <circle cx="18" cy="6" r="1.5" fill="#FFFFFF" fill-opacity="0.6"/>
    <circle cx="20" cy="4" r="1" fill="#FFFFFF" fill-opacity="0.4"/>
  </g>
</svg>
